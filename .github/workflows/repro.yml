name: Deadlock reproduction

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify-fix:
    name: Verify sentry-sdk 2.61.0 fix (no deadlock without workarounds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Run without workarounds (should complete normally)
        run: uv run python repro.py --timeout 120
